name: Publish LinuxPty.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Compute package version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required for deterministic commit-count versions.
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Packages can only be published from main." >&2
            exit 1
          fi

          COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.${COUNT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

  build:
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      package_version: ${{ needs.version.outputs.package_version }}
    permissions:
      contents: read

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: linuxpty-package
          path: artifacts/nuget

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/nuget/*.nupkg" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/abp321/index.json" \
            --skip-duplicate

      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: abp321

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./artifacts/nuget/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
