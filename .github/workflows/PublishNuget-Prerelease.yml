name: Publish LinuxPty.NET prerelease

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Prerelease label. The counter advances automatically (0.1.0-rc001, rc002, ...)'
        required: true
        default: 'rc'
        type: string

jobs:
  build-native-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build native PTY shim
        run: |
          cd src/Porta.Pty.Native
          chmod +x build.sh
          ./build.sh

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: src/Porta.Pty.Native/output/runtimes/linux-x64/native/libporta_pty.so

  build-native-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build native PTY shim
        run: |
          cd src/Porta.Pty.Native
          chmod +x build.sh
          ./build.sh

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: src/Porta.Pty.Native/output/runtimes/linux-arm64/native/libporta_pty.so

  # Retained while the initial fork still carries the upstream macOS implementation.
  build-native-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native PTY shim
        run: |
          cd src/Porta.Pty.Native
          chmod +x build.sh
          ./build.sh

      - name: Upload macOS ARM64 native library
        uses: actions/upload-artifact@v4
        with:
          name: native-osx-arm64
          path: src/Porta.Pty.Native/output/runtimes/osx-arm64/native/libporta_pty.dylib

      - name: Upload macOS x64 native library
        uses: actions/upload-artifact@v4
        with:
          name: native-osx-x64
          path: src/Porta.Pty.Native/output/runtimes/osx-x64/native/libporta_pty.dylib

  package-and-publish:
    runs-on: ubuntu-latest
    needs:
      - build-native-linux-x64
      - build-native-linux-arm64
      - build-native-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Linux x64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/Porta.Pty.Native/output/runtimes/linux-x64/native/

      - name: Download Linux ARM64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: src/Porta.Pty.Native/output/runtimes/linux-arm64/native/

      - name: Download macOS ARM64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: src/Porta.Pty.Native/output/runtimes/osx-arm64/native/

      - name: Download macOS x64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: src/Porta.Pty.Native/output/runtimes/osx-x64/native/

      - name: Compute the next prerelease version
        id: version
        run: |
          set -euo pipefail
          label='${{ inputs.label }}'

          if ! printf '%s' "$label" | grep -qE '^[0-9A-Za-z-]*[A-Za-z-]$'; then
            echo "::error::'$label' must contain only alphanumerics or hyphens and must not end in a digit"
            exit 1
          fi

          csproj=src/Porta.Pty/Porta.Pty.csproj
          base=$(grep -oP '(?<=<Version>)[^<]+' "$csproj" | head -1)
          package_id=$(grep -oP '(?<=<PackageId>)[^<]+' "$csproj" | head -1)
          if [ -z "$base" ] || [ -z "$package_id" ]; then
            echo "::error::PackageId or Version is missing from $csproj"
            exit 1
          fi

          flat_id=$(printf '%s' "$package_id" | tr '[:upper:]' '[:lower:]')
          index="https://api.nuget.org/v3-flatcontainer/$flat_id/index.json"
          status=$(curl -sS -o versions.json -w '%{http_code}' "$index" || echo 000)

          case "$status" in
            200) ;;
            404) echo '{"versions":[]}' > versions.json ;;
            *) echo "::error::nuget.org returned $status for $index"; exit 1 ;;
          esac

          prefix="$base-$label"
          latest=$(jq -r '.versions[]' versions.json \
            | awk -v p="$prefix" 'index($0, p) == 1 {
                  tail = substr($0, length(p) + 1)
                  if (tail ~ /^[0-9]+$/) { print tail + 0 }
                }' \
            | sort -n | tail -1)

          next=$(printf '%03d' "$(( 10#${latest:-0} + 1 ))")
          version="$prefix$next"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"
          echo "publishing: $package_id $version"

      - name: Restore dependencies
        run: dotnet restore src/Porta.Pty.sln

      - name: Build
        run: dotnet build src/Porta.Pty.sln -c Release --no-restore --property WarningLevel=0 -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack LinuxPty.NET prerelease
        run: dotnet pack --no-build src/Porta.Pty.sln -c Release -o packages --include-symbols --property WarningLevel=0 -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Verify package identity and contents
        run: |
          set -euo pipefail
          package=$(find packages -maxdepth 1 -type f -name 'LinuxPty.NET.*.nupkg' | head -1)
          [ -n "$package" ] || { echo "::error::LinuxPty.NET package was not produced"; ls -la packages; exit 1; }
          listing=$(unzip -l "$package")
          echo "$listing"
          grep -q 'README.md' <<<"$listing" || { echo "::error::README.md is missing from the package"; exit 1; }
          grep -q 'LICENSE' <<<"$listing" || { echo "::error::LICENSE is missing from the package"; exit 1; }
          grep -q 'runtimes/linux-x64/native/libporta_pty.so' <<<"$listing" || { echo "::error::linux-x64 shim is missing"; exit 1; }
          grep -q 'runtimes/linux-arm64/native/libporta_pty.so' <<<"$listing" || { echo "::error::linux-arm64 shim is missing"; exit 1; }

      - name: Publish NuGet and symbols
        id: nuget-push
        uses: edumserrano/nuget-push@v1
        with:
          api-key: '${{ secrets.NUGET_KEY }}'
          working-directory: 'packages'
          fail-if-exists: true

      - name: Summary
        run: |
          version='${{ steps.version.outputs.version }}'
          {
            echo "### Published \`LinuxPty.NET $version\`"
            echo
            echo '```bash'
            echo "dotnet add package LinuxPty.NET --version $version"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
