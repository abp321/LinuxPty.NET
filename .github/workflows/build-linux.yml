name: Linux CI

on:
  workflow_call:
    inputs:
      package_version:
        description: Optional NuGet package version override
        required: false
        type: string
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            platform: linux/amd64
            machine: Advanced Micro Devices X86-64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            machine: AArch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build native PTY shim
        env:
          CONTAINER_PLATFORM: ${{ matrix.platform }}
          EXPECTED_RID: ${{ matrix.rid }}
        run: |
          docker run --rm \
            --platform "$CONTAINER_PLATFORM" \
            -e EXPECTED_RID \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/Porta.Pty.Native \
            ubuntu:18.04 \
            bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                --no-install-recommends build-essential cmake binutils
              ./build.sh "$EXPECTED_RID"
            '

      - name: Verify native PTY shim
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          LIBRARY: src/Porta.Pty.Native/output/runtimes/${{ matrix.rid }}/native/libporta_pty.so
        run: |
          set -euo pipefail

          header="$(LC_ALL=C readelf -h "$LIBRARY")"
          actual_class="$(sed -n 's/^[[:space:]]*Class:[[:space:]]*//p' <<<"$header")"
          actual_machine="$(sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p' <<<"$header")"
          printf 'ELF class: %s\nELF machine: %s\n' "$actual_class" "$actual_machine"
          if [[ "$actual_class" != ELF64 || "$actual_machine" != "$EXPECTED_MACHINE" ]]; then
            echo "Unexpected ELF header for $LIBRARY." >&2
            exit 1
          fi

          versions="$(LC_ALL=C readelf --version-info "$LIBRARY" |
            grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' || true)"
          if [[ -z "$versions" ]]; then
            echo "No GLIBC symbol versions found in $LIBRARY." >&2
            exit 1
          fi
          maximum="$(printf '%s\n' "$versions" |
            sed 's/^GLIBC_//' | sort -Vu | tail -1)"
          printf 'Maximum GLIBC version: %s\n' "$maximum"
          if [[ "$(printf '%s\n' 2.27 "$maximum" | sort -V | tail -1)" != 2.27 ]]; then
            echo "Maximum GLIBC version $maximum exceeds 2.27." >&2
            exit 1
          fi

          mapfile -t exports < <(
            LC_ALL=C nm -D --defined-only "$LIBRARY" |
              awk 'NF >= 3 {print $3}' | sort
          )
          expected=(
            pty_cleanup_untracked
            pty_close
            pty_io_read
            pty_io_write
            pty_kill
            pty_pidfd_send_signal
            pty_reactor_control
            pty_reactor_create
            pty_reactor_drain
            pty_reactor_wait
            pty_reactor_wake
            pty_resize
            pty_spawn
            pty_wait_child
          )
          printf 'Exported symbols:\n'
          printf '%s\n' "${exports[@]}"
          if [[ ${#exports[@]} -ne ${#expected[@]} ]]; then
            echo "Native PTY shim exports ${#exports[@]} symbols; expected ${#expected[@]}." >&2
            exit 1
          fi
          for index in "${!expected[@]}"; do
            if [[ "${exports[index]}" != "${expected[index]}" ]]; then
              echo "Native export $index is '${exports[index]}'; expected '${expected[index]}'." >&2
              exit 1
            fi
          done

          if LC_ALL=C readelf -d "$LIBRARY" | grep -Eq '(RPATH|RUNPATH)'; then
            echo "Native PTY shim must not contain RPATH or RUNPATH." >&2
            exit 1
          fi

      - name: Upload native PTY shim
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: src/Porta.Pty.Native/output/runtimes/${{ matrix.rid }}/native/libporta_pty.so
          if-no-files-found: error
          retention-days: 1

  package:
    name: Build and pack
    needs: native
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download linux-x64 native PTY shim
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: src/Porta.Pty.Native/output/runtimes/linux-x64/native

      - name: Download linux-arm64 native PTY shim
        uses: actions/download-artifact@v8
        with:
          name: native-linux-arm64
          path: src/Porta.Pty.Native/output/runtimes/linux-arm64/native

      - name: Restore
        run: dotnet restore LinuxPty.NET.slnx

      - name: Build
        run: >
          dotnet build LinuxPty.NET.slnx
          -c Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ inputs.package_version || '' }}
        run: |
          set -euo pipefail
          version_args=()
          if [[ -n "$PACKAGE_VERSION" ]]; then
            version_args+=("-p:PackageVersion=$PACKAGE_VERSION")
          fi

          dotnet pack src/Porta.Pty/Porta.Pty.csproj \
            -c Release \
            --no-build \
            -o artifacts/nuget \
            -p:ContinuousIntegrationBuild=true \
            "${version_args[@]}"

      - name: Verify package
        env:
          EXPECTED_PACKAGE_VERSION: ${{ inputs.package_version || '' }}
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find artifacts/nuget -maxdepth 1 -type f \
              -name 'LinuxPty.NET.*.nupkg' ! -name '*.snupkg' | sort
          )
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected one LinuxPty.NET package, found ${#packages[@]}." >&2
            find artifacts/nuget -maxdepth 1 -type f -print
            exit 1
          fi

          package="${packages[0]}"
          listing="$(unzip -Z1 "$package")"
          printf '%s\n' "$listing"

          for required in \
            README.md \
            LICENSE \
            lib/net10.0/Porta.Pty.dll \
            runtimes/linux-x64/native/libporta_pty.so \
            runtimes/linux-arm64/native/libporta_pty.so
          do
            grep -Fxq "$required" <<<"$listing" || {
              echo "Package entry is missing: $required" >&2
              exit 1
            }
          done

          native_count="$(grep -Ec '^runtimes/[^/]+/native/' <<<"$listing")"
          test "$native_count" -eq 2

          if grep -Eiq \
            '(^|/)(runtimes/(win-|osx-)|tests?(/|$)|samples?(/|$)|icon\.png$)|conpty|openconsole|\.dylib$|buildtransitive' \
            <<<"$listing"
          then
            echo "Package contains a removed platform or repository artifact." >&2
            exit 1
          fi

          cmp -s README.md <(unzip -p "$package" README.md)
          cmp -s LICENSE <(unzip -p "$package" LICENSE)

          nuspec="$(grep -E '\.nuspec$' <<<"$listing")"
          actual_version="$(unzip -p "$package" "$nuspec" |
            sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' | head -1)"
          test -n "$actual_version"
          if [[ -n "$EXPECTED_PACKAGE_VERSION" &&
                "$actual_version" != "$EXPECTED_PACKAGE_VERSION" ]]; then
            echo "Package version '$actual_version' does not match '$EXPECTED_PACKAGE_VERSION'." >&2
            exit 1
          fi

          verify_native() {
            local path="$1"
            local expected_machine="$2"
            local extracted
            extracted="$(mktemp)"
            unzip -p "$package" "$path" > "$extracted"

            local header actual_class actual_machine versions maximum
            local -a exports expected
            header="$(LC_ALL=C readelf -h "$extracted")"
            actual_class="$(sed -n 's/^[[:space:]]*Class:[[:space:]]*//p' <<<"$header")"
            actual_machine="$(sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p' <<<"$header")"
            printf '%s: ELF class=%s, machine=%s\n' "$path" "$actual_class" "$actual_machine"
            if [[ "$actual_class" != ELF64 || "$actual_machine" != "$expected_machine" ]]; then
              echo "Unexpected packaged ELF header for $path." >&2
              exit 1
            fi

            versions="$(LC_ALL=C readelf --version-info "$extracted" |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' || true)"
            if [[ -z "$versions" ]]; then
              echo "No GLIBC symbol versions found in packaged asset $path." >&2
              exit 1
            fi
            maximum="$(printf '%s\n' "$versions" |
              sed 's/^GLIBC_//' | sort -Vu | tail -1)"
            printf '%s: maximum GLIBC version=%s\n' "$path" "$maximum"
            if [[ "$(printf '%s\n' 2.27 "$maximum" | sort -V | tail -1)" != 2.27 ]]; then
              echo "Packaged asset $path requires GLIBC $maximum, above 2.27." >&2
              exit 1
            fi

            mapfile -t exports < <(
              LC_ALL=C nm -D --defined-only "$extracted" |
                awk 'NF >= 3 {print $3}' | sort
            )
            expected=(
              pty_cleanup_untracked
              pty_close
              pty_io_read
              pty_io_write
              pty_kill
              pty_pidfd_send_signal
              pty_reactor_control
              pty_reactor_create
              pty_reactor_drain
              pty_reactor_wait
              pty_reactor_wake
              pty_resize
              pty_spawn
              pty_wait_child
            )
            printf '%s: exported symbols:\n' "$path"
            printf '%s\n' "${exports[@]}"
            if [[ ${#exports[@]} -ne ${#expected[@]} ]]; then
              echo "Packaged asset $path exports ${#exports[@]} symbols; expected ${#expected[@]}." >&2
              exit 1
            fi
            for index in "${!expected[@]}"; do
              if [[ "${exports[index]}" != "${expected[index]}" ]]; then
                echo "Packaged export $index is '${exports[index]}'; expected '${expected[index]}'." >&2
                exit 1
              fi
            done

            if LC_ALL=C readelf -d "$extracted" | grep -Eq '(RPATH|RUNPATH)'; then
              echo "Packaged native PTY shim must not contain RPATH or RUNPATH." >&2
              exit 1
            fi
            rm -f "$extracted"
          }

          verify_native \
            runtimes/linux-x64/native/libporta_pty.so \
            'Advanced Micro Devices X86-64'
          verify_native \
            runtimes/linux-arm64/native/libporta_pty.so \
            AArch64

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: linuxpty-package
          path: artifacts/nuget/LinuxPty.NET.*.nupkg
          if-no-files-found: error
          retention-days: 7
